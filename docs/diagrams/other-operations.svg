<svg xmlns="http://www.w3.org/2000/svg" id="arch" data-flow="o" viewBox="0 0 1000 545" width="1000" height="545">
<style>
#arch {
  --bg: #f4f5f8; --surface: #ffffff; --fg: #1b1f27; --muted: #5b6374; --line: #d7dbe4; --band: #eceef3;
  --accent: #2f5bd3;
  --ft: #2f5bd3; --fm: #0d7f70; --fp: #7a3fc4; --fw: #c2530c; --fo: #5b6374;
  --display: "Space Grotesk", system-ui, sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
 --display: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; --sel: transparent;}
@media (prefers-color-scheme: dark) { #arch {
  --bg: #12151b; --surface: #1a1e26; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2e3440; --band: #161a21;
  --accent: #8aa6ff;
  --ft: #8aa6ff; --fm: #4fd1bd; --fp: #c39bff; --fw: #ff9f60; --fo: #b7bfcc; color-scheme: dark } }
#arch .bg { fill: var(--surface); stroke: var(--line); }

#arch .box rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
#arch .t1 { fill: var(--fg); font: 700 15px var(--display); }
#arch .t1s { fill: var(--fg); font: 700 13px var(--display); }
#arch .t2 { fill: var(--muted); font: 11px var(--mono); }
#arch .box[data-k] { cursor: pointer; }
#arch .box[data-k]:focus { outline: none; }
#arch .box[data-k]:hover rect, #arch .box.sel rect { fill: var(--sel); }
#arch .box[data-k]:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
#arch .dep { fill: none; stroke: var(--fg); stroke-width: 1.6; opacity: .8; marker-end: url(#ah-d); }
#arch .use { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 4 4; marker-end: url(#ah-u); }
#arch .ah-d { fill: var(--fg); } #arch .ah-u { fill: var(--muted); }
#arch .dl, #arch .ul { font: 600 11px var(--mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
#arch .dl { fill: var(--fg); } #arch .ul { fill: var(--muted); font-weight: 500; }

#arch .band { fill: var(--band); }
#arch .bl { fill: var(--muted); font: 600 11px var(--body); letter-spacing: .08em; }
#arch .box rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: stroke .2s; }
#arch .t1 { fill: var(--fg); font: 700 15px var(--display); }
#arch .t1s { fill: var(--fg); font: 700 13px var(--display); }
#arch .t2 { fill: var(--muted); font: 11px var(--mono); }
#arch .e { fill: none; stroke: var(--line); stroke-width: 2; opacity: .55; }
#arch .s { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .7; }
#arch .sl { fill: var(--muted); font: 11px var(--mono); }
#arch .ah-s { fill: var(--muted); }
#arch .ah-t { fill: var(--ft); } #arch .ah-m { fill: var(--fm); } #arch .ah-p { fill: var(--fp); }
#arch .ah-w { fill: var(--fw); } #arch .ah-o { fill: var(--fo); }
#arch .el { display: none; font: 600 11px var(--mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
#arch[data-flow="t"] .e.t { stroke: var(--ft); marker-end: url(#ah-t); }
#arch[data-flow="m"] .e.m { stroke: var(--fm); marker-end: url(#ah-m); }
#arch[data-flow="p"] .e.p { stroke: var(--fp); marker-end: url(#ah-p); }
#arch[data-flow="w"] .e.w { stroke: var(--fw); marker-end: url(#ah-w); }
#arch[data-flow="o"] .e.o { stroke: var(--fo); marker-end: url(#ah-o); }
#arch[data-flow="t"] .e.t, #arch[data-flow="m"] .e.m, #arch[data-flow="p"] .e.p,
#arch[data-flow="w"] .e.w, #arch[data-flow="o"] .e.o {
  opacity: 1; stroke-width: 2.5; stroke-dasharray: 7 5; animation: dash .9s linear infinite; }
#arch[data-flow="t"] .el.t { display: inline; fill: var(--ft); }
#arch[data-flow="m"] .el.m { display: inline; fill: var(--fm); }
#arch[data-flow="p"] .el.p { display: inline; fill: var(--fp); }
#arch[data-flow="w"] .el.w { display: inline; fill: var(--fw); }
#arch[data-flow="o"] .el.o { display: inline; fill: var(--fo); }
#arch[data-flow="t"] .box.t rect { stroke: var(--ft); stroke-width: 2.5; }
#arch[data-flow="m"] .box.m rect { stroke: var(--fm); stroke-width: 2.5; }
#arch[data-flow="p"] .box.p rect { stroke: var(--fp); stroke-width: 2.5; }
#arch[data-flow="w"] .box.w rect { stroke: var(--fw); stroke-width: 2.5; }
#arch[data-flow="o"] .box.o rect { stroke: var(--fo); stroke-width: 2.5; }
@keyframes dash { to { stroke-dashoffset: -12; } }
#arch .box[data-k] { cursor: pointer; }
#arch .box[data-k]:focus { outline: none; }
#arch .box[data-k]:hover rect, #arch .box.sel rect { fill: var(--sel); }
#arch .box[data-k]:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
</style>
<rect class="bg" x="0.5" y="0.5" width="999" height="544" rx="10"/>
        <defs>
          <marker id="ah-s" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ah-s" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah-t" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah-m" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah-p" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-w" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah-w" d="M0 0L10 5L0 10z"/></marker>
          <marker id="ah-o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="ah-o" d="M0 0L10 5L0 10z"/></marker>
        </defs>

        <!-- bands -->
