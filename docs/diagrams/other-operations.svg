        <!-- boxes -->
        <g class="box" data-k="py" tabindex="0" role="button" aria-label="Python SDK"><rect x="40" y="40" width="440" height="58" rx="8"/>
          <text class="t1" x="56" y="64">Python SDK</text>
          <text class="t2" x="56" y="84">exceptions · pandas · planned: codegen views · ml</text></g>
        <g class="box" data-k="rs" tabindex="0" role="button" aria-label="Rust SDK"><rect x="520" y="40" width="440" height="58" rx="8"/>
          <text class="t1" x="536" y="64">Rust SDK</text>
          <text class="t2" x="536" y="84">async API · Result · planned: blocking API · codegen</text></g>

        <g class="box o" data-k="client" tabindex="0" role="button" aria-label="MosaicoClient"><rect x="40" y="148" width="160" height="58" rx="8"/>
          <text class="t1" x="52" y="172">MosaicoClient</text><text class="t2" x="52" y="192">connect · query</text></g>
        <g class="box t p" data-k="topic" tabindex="0" role="button" aria-label="TopicHandler"><rect x="220" y="148" width="200" height="58" rx="8"/>
          <text class="t1" x="232" y="172">TopicHandler</text><text class="t2" x="232" y="192">streamers · to_arrow</text></g>
        <g class="box m" data-k="seq" tabindex="0" role="button" aria-label="SequenceHandler"><rect x="440" y="148" width="180" height="58" rx="8"/>
          <text class="t1" x="452" y="172">SequenceHandler</text><text class="t2" x="452" y="192">multi-topic merge</text></g>
        <g class="box w" data-k="writer" tabindex="0" role="button" aria-label="SequenceWriter and SequenceUpdater"><rect x="636" y="148" width="168" height="58" rx="8"/>
          <text class="t1s" x="648" y="165">SequenceWriter</text><text class="t1s" x="648" y="181">SequenceUpdater</text><text class="t2" x="648" y="198">topic_create · finish</text></g>
        <g class="box w" data-k="twriter" tabindex="0" role="button" aria-label="TopicWriter"><rect x="820" y="148" width="140" height="58" rx="8"/>
          <text class="t1" x="832" y="172">TopicWriter</text><text class="t2" x="832" y="192">push · push_batch</text></g>

