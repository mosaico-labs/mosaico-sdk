        <path class="s" d="M740 98 V122" marker-end="url(#ah-s)"/>
        <path class="s" d="M500 414 V464" marker-start="url(#ah-s)" marker-end="url(#ah-s)"/>
        <text class="sl" x="508" y="446">Arrow Flight · main + extra connections</text>

        <!-- flow edges -->
        <path class="e t" d="M250 206 V366"/>
        <path class="e t" d="M340 206 V256"/>
        <path class="e t m p" d="M340 318 V366"/>
        <path class="e t" d="M400 258 V208"/>
