[workspace]
resolver = "3"
members = ["mosaico-core", "mosaico-ontology"]

[workspace.dependencies]
arrow-array = "58"
arrow-schema = "58"
arrow-buffer = "58"
arrow-data = "58"
arrow-flight = { version = "58", default-features = false }
# Not used directly: enables decoding of the LZ4-compressed IPC that mosaicod sends
arrow-ipc = { version = "58", features = ["lz4"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }
prost = "0.14"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
futures = { version = "0.3", default-features = false }
mosaico-core = { path = "mosaico-core" }
