[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mosaico-rs"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["pyarrow", "pandas", "mosaicolabs"]

[tool.maturin]
manifest-path = "mosaico-py/Cargo.toml"
python-source = "python"
module-name = "mosaico_rs._core"
features = ["pyo3/extension-module"]
